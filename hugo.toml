baseURL = "https://pmallappa.github.io"
languageCode = "en-us"
title = "Prem Mallappa"
theme = "personal"

# Pagination configuration
[pagination]
  pagerSize = 20

# Content configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "nord"
    lineNos = true
    lineNumbersInTable = false
    tabWidth = 2

# Menu configuration
[menu]
  [[menu.main]]
    name = "Home"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "Articles"
    url = "/articles/"
    weight = 20
  [[menu.main]]
    name = "Series"
    url = "/series/"
    weight = 30
  [[menu.main]]
    name = "Projects"
    url = "/projects/"
    weight = 40
  [[menu.main]]
    name = "Resume"
    url = "/resume/"
    weight = 50
  # Farming section is accessible at /farming/ but hidden from main menu
  # [[menu.main]]
  #   name = "Farming"
  #   url = "/farming/"
  #   weight = 60

# Site parameters
[params]
  description = "Personal website of Prem Mallappa - Technology and Farming insights"
  author = "Prem Mallappa"
  email = "your-email@example.com"
  github = "pmallappa"
  linkedin = "pmallappa"
  
  # Layout configuration
  [params.layout]
    maxWidth = "max-w-7xl"
    contentMaxWidth = "max-w-5xl"
    sidebarWidth = "w-64"
    padding = "px-4 sm:px-6 lg:px-8"
    verticalSpacing = "py-12"
  
  # Features
  search = true
  toc = true
  analytics = false
  
  # Content categories
  [params.categories]
    technology = ["systems", "languages", "architecture"]
    farming = ["techniques", "technology", "sustainability"]

# Taxonomies
[taxonomies]
  tag = "tags"
  category = "categories"

# Output formats
[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

# Build configuration
[build]
  writeStats = true
  
[[build.cachebusters]]
  source = "assets/watching/hugo_stats\\.json"
  target = "styles\\.css"

[[build.cachebusters]]
  source = "(postcss|tailwind)\\.config\\.js"
  target = "css"

[[build.cachebusters]]
  source = "assets/.*\\.(js|ts|jsx|tsx)"
  target = "js"

[[build.cachebusters]]
  source = "assets/.*\\.(.*)$"
  target = "$1"