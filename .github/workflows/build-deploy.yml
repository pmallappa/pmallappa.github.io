name: Build and Deploy Website

on:
  push:
    branches: [ main, devel ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: '0.152.2'
        extended: true

    - name: Setup Emacs
      uses: purcell/setup-emacs@master
      with:
        version: 29.1

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        npm ci
        sudo apt-get update
        sudo apt-get install -y imagemagick optipng jpegoptim

    - name: Export org files to Hugo markdown
      run: |
        # Use the export script to convert .org to .md via ox-hugo
        chmod +x ./scripts/export-org.sh
        ./scripts/export-org.sh

    - name: Build Hugo site
      run: |
        hugo --gc --minify

    - name: Optimize static assets
      run: |
        # Optimize images in public directory
        find public/images -name "*.png" -exec optipng -o7 {} \; 2>/dev/null || true
        find public/images -name "*.jpg" -exec jpegoptim --max=85 {} \; 2>/dev/null || true

    - name: Setup Pages
      if: github.ref == 'refs/heads/main'
      uses: actions/configure-pages@v4

    - name: Upload artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: 'public'

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  lighthouse:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Lighthouse CI
      run: npm install -g @lhci/cli@0.12.x
    
    - name: Run Lighthouse CI
      run: |
        lhci autorun \
          --collect.url="https://${{ github.repository_owner }}.github.io/" \
          --collect.numberOfRuns=3 \
          --assert.preset=lighthouse:no-pwa \
          --assert.assertions.performance=0.9 \
          --assert.assertions.accessibility=0.95 \
          --assert.assertions.best-practices=0.9 \
          --assert.assertions.seo=0.9 \
          --upload.target=temporary-public-storage
      continue-on-error: true