{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ config.title }}{% endblock title %}

{% block body %}
<section class="py-5 md:py-10">
  <div class="bg-gray-50 px-8 py-10 rounded-md post-content">
    <h1 class="font-medium text-gray-700 text-3xl md:text-4xl mb-5 font-poppins">{{ page.title }}</h1>
    {{ page.content | safe }}
  </div>
</section>
{% endblock body %}
