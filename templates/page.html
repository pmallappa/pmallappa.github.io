{% extends "base.html" %}

{% block title %}{{ page.title }} - {{ config.title }}{% endblock title %}

{% block body %}
<div class="content-wrap" style="padding-top:2rem;padding-bottom:3rem;">
  <div class="prompt-line mb-3" style="color:var(--dim);">$ <span style="color:var(--fg);">cat {{ page.path }}.md</span></div>
  <div class="post-content reveal">
    <h1 style="color:var(--accent);font-weight:700;font-size:1.6rem;border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:16px;">
      {{ page.title | upper }}
    </h1>
    {{ page.content | safe }}
  </div>
</div>
{% endblock body %}
