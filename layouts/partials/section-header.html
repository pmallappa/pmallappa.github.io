{{/*
  Reusable section header partial
  Usage: {{ partial "section-header.html" . }}
*/}}

<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="mb-16">
    <h1 class="text-4xl font-bold mb-4 text-nord-frost-2">{{ .Title }}</h1>
    {{ if .Content }}
      <div class="prose prose-lg prose-gray mb-8" style="color: #4C566A;">
        {{ .Content }}
      </div>
    {{ end }}
  </div>

  <div class="h-16"></div>

  <div class="space-y-8">
