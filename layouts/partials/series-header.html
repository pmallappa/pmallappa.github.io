<!-- Series Header -->
<div class="mb-12">
  <div class="flex items-center mb-4 flex-wrap gap-2">
    {{ partial "series-count-badge.html" . }}
  </div>
  
  <h1 class="text-4xl font-bold mb-4 text-nord-frost-2">{{ .Title }}</h1>
  
  <!-- Metadata -->
  <div class="flex items-center text-gray-600 text-sm mb-6">
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
  </div>
  
  <!-- Description -->
  {{ if .Description }}
  <div class="text-xl text-gray-700 mb-6">
    {{ .Description }}
  </div>
  {{ end }}
</div>
