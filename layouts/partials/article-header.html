<!-- Article/Post Header -->
<header class="mb-8">
  <div class="flex items-center mb-4">
    {{ range .Params.categories }}
      <span class="bg-nord-aurora-green/20 text-nord-aurora-green border border-nord-aurora-green/30 text-sm px-3 py-1 rounded-full mr-2">{{ . }}</span>
    {{ end }}
    {{ if .Draft }}
      <span class="bg-red-100 text-red-800 text-sm px-3 py-1 rounded-full font-medium">DRAFT</span>
    {{ end }}
  </div>
  
  <h1 class="text-4xl font-bold text-gray-900 leading-tight mb-4">{{ .Title }}</h1>
  
  {{ partial "article-meta.html" . }}
  
  {{ if .Params.summary }}
  <p class="text-lg text-gray-600 leading-relaxed">{{ .Params.summary }}</p>
  {{ end }}
  
  {{ partial "tags.html" . }}
</header>
