{{ define "main" }}

<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  <div class="mb-8">
    <h1 class="text-4xl font-bold mb-4 text-nord-frost-2">{{ .Title }}</h1>
  </div>

  <div class="space-y-6">
    {{ range .Site.Pages }}
      {{ if and (eq .Type "series") (ne .RelPermalink "/series/") }}
        {{ partial "series-card.html" . }}
      {{ end }}
    {{ end }}
  </div>
</div>
{{ end }}
